# JitPack builds this SDK from source and serves it from https://jitpack.io.
# JitPack sets GROUP, ARTIFACT and VERSION. The build publishes the modules under these coordinates.
# The compilation and Dokka run in two Gradle processes, because one process with both can run out of memory.
jdk:
  - openjdk21
install:
  - ./gradlew classes -PpublishLocal -PjitpackGroup="${GROUP}.${ARTIFACT}" -PjitpackVersion="${VERSION}" -Pkotlin.compiler.execution.strategy=in-process --no-daemon --no-parallel --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
  - ./gradlew publishToMavenLocal -PpublishLocal -PjitpackGroup="${GROUP}.${ARTIFACT}" -PjitpackVersion="${VERSION}" -Pkotlin.compiler.execution.strategy=in-process --no-daemon --no-parallel --no-configuration-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
